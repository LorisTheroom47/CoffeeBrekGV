name: Cloudflare OpenNext build

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11.18.0"
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Diagnose pnpm context
        shell: bash
        run: |
          set -euo pipefail
          echo "GITHUB_SHA=$GITHUB_SHA"
          git rev-parse HEAD
          pwd
          pnpm --version
          pnpm config list --json | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => {
              input += chunk;
            });
            process.stdin.on("end", () => {
              const config = JSON.parse(input);
              const allowBuilds = config.allowBuilds ?? {};
              const unrsResolver = Object.fromEntries(
                Object.entries(allowBuilds).filter(
                  ([name]) =>
                    name === "unrs-resolver" ||
                    name.startsWith("unrs-resolver@"),
                ),
              );

              console.log(
                JSON.stringify({ allowBuilds: unrsResolver }, null, 2),
              );
            });
          '

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Audit dependencies
        run: pnpm audit

      - name: Build Next.js
        run: pnpm build

      - name: Build OpenNext for Cloudflare
        run: pnpm cf:build

      - name: Measure OpenNext output
        shell: bash
        run: |
          set -euo pipefail
          test -f .open-next/worker.js

          total_bytes="$(du -sb .open-next | cut -f1)"
          worker_bytes="$(stat --format='%s' .open-next/worker.js)"
          worker_gzip_bytes="$(gzip -9 -c .open-next/worker.js | wc -c | tr -d ' ')"

          {
            echo "OpenNext output bytes: ${total_bytes}"
            echo "Worker main bytes: ${worker_bytes}"
            echo "Worker main gzip bytes: ${worker_gzip_bytes}"
          } | tee cloudflare-build-report.txt

      - name: Upload OpenNext artifact
        uses: actions/upload-artifact@v4
        with:
          name: coffee-break-opennext-build
          path: |
            website/.open-next/
            website/cloudflare-build-report.txt
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
